packages:
  - "packages/*"
  - "examples/*"
  # The Python SDK is not a JS package; it carries a package.json purely so
  # turbo can drive it through the same four task names as everything else.
  - "python/*"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - '@types/node@26.1.2'
  - jsdom@30.0.1
