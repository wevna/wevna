name: Release

# Publishes on a pushed version tag (v1.0.0, v1.0.1, ...) rather than on
# every push to main, so cutting a release is a deliberate act and not a
# side effect of merging.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the published packages set
      # publishConfig.provenance, which needs an OIDC token to attest that
      # the tarball was built from this commit in this workflow. Publishing
      # from a laptop cannot produce that attestation — which is the reason
      # this workflow exists rather than a local `pnpm release`.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The Verify step below runs the same gate as CI, which now includes the
      # Python SDK's tasks.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, not just a build: a release must not be the one path
      # that skips the checks every pull request has to pass.
      - name: Verify
        run: pnpm turbo run build check test lint

      # pnpm, not npm: the published packages depend on @wevna/protocol via
      # `workspace:^`, and only pnpm rewrites that to a real semver range at
      # pack time. `-r` publishes every non-private package, which is exactly
      # the three public ones — the internal packages are marked private
      # precisely so this needs no list to keep in sync.
      #
      # No NODE_AUTH_TOKEN, deliberately. All three packages have a trusted
      # publisher on npm pinned to this repository and this workflow file, so
      # pnpm exchanges the `id-token: write` OIDC token above for a
      # short-lived registry credential at publish time. There is no long-
      # lived secret to rotate, leak, or lose, and it sidesteps npm's
      # deprecation of 2FA-bypass tokens for direct publishing (Jan 2027).
      #
      # This is also what makes the provenance attestation work. v1.0.0
      # published before the trusted publishers existed: pnpm tried the
      # exchange, got a 404, fell back to a token, and shipped without
      # provenance despite publishConfig.provenance being set — silently. If
      # a future run logs "Skipped OIDC", the attestation is missing again
      # and the trusted publisher config is what to check.
      - name: Publish
        run: pnpm publish -r --access public --no-git-checks
