name: Release (Python)

# Tag `python-v0.1.0` to publish python/ as `wevna` 0.1.0 on PyPI. Separate
# from the npm release (release.yml, tags `v*`): the two SDKs version
# independently.
on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A tag that disagrees with pyproject.toml would publish a version
      # nobody asked for, or fail only after the upload.
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "python-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Install optional dependencies
        run: pip install requests redis httpx flask fastapi sqlalchemy build twine

      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t .

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI exchanges this OIDC token for a short-lived
      # credential. No API token is stored anywhere. Needs a trusted publisher
      # configured on PyPI for this repository and this workflow file (see
      # TODO.md).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
