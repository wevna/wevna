[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wevna"
version = "0.1.0"
description = "Local-first runtime dashboard for Python backends. Watch HTTP, SQL, Redis and log activity live, correlated per request."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Boluwatife Ajayi" }]
keywords = [
  "observability", "debugging", "devtools", "fastapi", "asgi", "starlette",
  "runtime", "backend", "dashboard", "instrumentation", "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
dependencies = [
  # The dashboard is served from this process, so a server is not optional.
  # Both are already present in any FastAPI project, and this is a development
  # tool rather than something added to a production dependency tree.
  "starlette>=0.40",
  "uvicorn>=0.30",
  "websockets>=12.0",
]

# Instrumentation for a library you do not use should not make you install it.
# Each extra pulls in only what its own integration imports.
[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
redis = ["redis>=5.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
  "ruff>=0.9",
  # Only the tests need these. The middleware itself is written against raw
  # ASGI and imports neither, which is what lets it work with any ASGI
  # framework rather than the one it was developed against.
  "httpx>=0.27",
  # FastAPI is the headline target, and it resolves routes differently from
  # bare Starlette, so both are tested rather than one being assumed to stand
  # in for the other.
  "fastapi>=0.115",
  # Phase 2 targets. SQLAlchemy is tested against both its sync and async
  # engines, which take different code paths through the event system.
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "redis>=5.0",
  # A real redis-py-compatible server in memory. The point is to exercise
  # redis-py's own client code paths rather than a stub of them, since what is
  # being instrumented is redis-py's method, not Redis itself.
  "fakeredis>=2.23",
]

[project.urls]
Homepage = "https://github.com/wevna/wevna"
Repository = "https://github.com/wevna/wevna"
Issues = "https://github.com/wevna/wevna/issues"
Changelog = "https://github.com/wevna/wevna/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/wevna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
